# TSharpVision.Samples.TVTerm.cfg
#
# Optional runtime configuration.
# Only the settings you specify are applied; missing settings preserve defaults.
#
# Supported keys:
#   [driver]    name       - Driver to use: sdl | console
#   [graphics]  fontName   - Font family name for any graphical driver
#   [graphics]  fontSize   - Font point size for any graphical driver
#   [sdl]       presentMode, backend, continuous, allowedFrames, boxCalibration, diagnostics

[driver]
name=console

[graphics]
fontName=Lucida Console
